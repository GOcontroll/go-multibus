name: Build and publish go-multibus package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # Pure Python, so there is nothing to compile - but a syntax error would
      # otherwise only surface on a controller, after the package is published.
      - name: Byte-compile every script and module
        run: |
          set -euo pipefail
          for f in bin/* lib/*.py; do
            python3 -m py_compile "$f"
            echo "ok $f"
          done

      # Same script you can run locally, so what CI publishes is what you can
      # build and inspect by hand.
      - name: Build .deb
        run: |
          debian/build-deb.sh "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/dist"
          dpkg-deb --contents \
            "${RUNNER_TEMP}/dist/go-multibus_${{ steps.version.outputs.version }}_all.deb"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist/go-multibus_${{ steps.version.outputs.version }}_all.deb
          generate_release_notes: true

      - name: Trigger go-apt index rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
          repository: GOcontroll/go-apt
          event-type: rebuild-index
          client-payload: |
            {
              "package": "go-multibus",
              "version": "${{ steps.version.outputs.version }}",
              "arch": "all",
              "deb_url": "https://github.com/GOcontroll/go-multibus/releases/download/${{ github.ref_name }}/go-multibus_${{ steps.version.outputs.version }}_all.deb"
            }
