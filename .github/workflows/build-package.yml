name: Build and publish go-multibus package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install zig
        run: |
          ZIG_VERSION=0.13.0
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          tar xf "zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Install cargo-zigbuild and dpkg-dev
        run: |
          cargo install cargo-zigbuild --locked
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # Runs on the host. Every test is pure logic - the frame codec, the module
      # bus message format, the configuration file - so none of it needs a
      # controller or a module.
      - name: Test
        run: cargo test

      - name: Cargo cross-build (release, arm64, musl static)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      # The one script left in the package. A syntax error in it would otherwise
      # only surface on a controller, after the package is published.
      - name: Byte-compile the boot-environment helper
        run: python3 -m py_compile bin/gocontroll-usb-hostmode

      # Same script you can run locally, so what CI publishes is what you can
      # build and inspect by hand.
      - name: Build .deb
        env:
          BINDIR: target/aarch64-unknown-linux-musl/release
        run: |
          debian/build-deb.sh "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/dist"
          dpkg-deb --contents \
            "${RUNNER_TEMP}/dist/go-multibus_${{ steps.version.outputs.version }}_arm64.deb"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist/go-multibus_${{ steps.version.outputs.version }}_arm64.deb
          generate_release_notes: true

      - name: Trigger go-apt index rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
          repository: GOcontroll/go-apt
          event-type: rebuild-index
          client-payload: |
            {
              "package": "go-multibus",
              "version": "${{ steps.version.outputs.version }}",
              "arch": "arm64",
              "deb_url": "https://github.com/GOcontroll/go-multibus/releases/download/${{ github.ref_name }}/go-multibus_${{ steps.version.outputs.version }}_arm64.deb"
            }
